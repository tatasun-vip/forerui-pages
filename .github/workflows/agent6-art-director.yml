name: "Agent 6 · 美术官 (Art Director)"

on:
  schedule:
    # 每两周周一 UTC 05:00（北京时间周一 13:00）
    - cron: "0 5 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  art-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 按日期轮换美术提案主题
        id: theme
        run: |
          DAY=$(date -u +%d)
          if [ "$DAY" -le 15 ]; then
            THEME="符文视觉迭代"
            SLUG="rune-visual"
            ANGLE="审视现有 8 张精选卡面，提出下一批符文的视觉方向：篆书笔意、朱砂金墨层次、宣纸肌理、留白呼吸。给出具体的配色比例、构图建议、可新增的纹样元素（祥云/水纹/星宿）。"
          else
            THEME="网站视觉与体验"
            SLUG="site-visual"
            ANGLE="审视落地页与卡片展示体验，提出改版建议：首屏情绪、卡片陈列节奏、悬停/翻面微交互、移动端观感、会员制三档的视觉层级。贴合宣纸暖牙色 #EDE4D3 / 朱砂 #C02000 / 金墨 #B08A3E 品牌语言。"
          fi
          echo "theme=$THEME" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "ANGLE=$ANGLE" >> "$GITHUB_ENV"
          echo "本期主题：$THEME"

      - name: 生成美术提案 Issue
        uses: actions/github-script@v7
        with:
          script: |
            const theme = '${{ steps.theme.outputs.theme }}';
            const slug = '${{ steps.theme.outputs.slug }}';
            const angle = process.env.ANGLE;
            const date = new Date().toISOString().slice(0,10);
            const title = `[ART] 美术提案 · ${theme} (${date})`;
            const body = `## 🎨 本期美术提案：${theme}\n\n> 由 Agent 6 美术官自动生成，供老板审阅。**采纳后由人工/设计师执行。**\n\n> **能力边界**：社交运营（X 发帖、互动涨粉、真人成交）不在自动化范围，需真人执行。详见 [AGENTS.md](../blob/main/AGENTS.md)。\n\n### 核心方向\n${angle}\n\n### 硬性铁律（不可违反）\n- ❌ **禁止 AI 生成图** —— 一律真人手绘/真实素材，避免水印与 AI 标识。\n- ✅ 沿用品牌语言：宣纸暖牙色 #EDE4D3、朱砂 #C02000、金墨渐变 #D4A843→#F0D870、毛笔枯笔飞白。\n- ✅ 每张符文中英对照；手绘温度优先于精致度。\n\n### 建议输出物\n1. 本期主题的具体改进清单（3-5 条，可执行）。\n2. 配色/构图/字体的参数级建议。\n3. 若涉及新卡面：先给文字方向，老板确认后再安排绘制。\n\n### 请老板回复\n- [ ] 采纳 → 我来细化执行方案\n- [ ] 调整方向 → 请注明\n- [ ] 本期跳过\n\n<!-- agent6:${slug}:${date} -->`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'art-proposal', per_page: 30
            });
            const dup = issues.find(i => i.body && i.body.includes(`agent6:${slug}:${date}`));
            if (dup) { console.log('本期提案已存在，跳过'); return; }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['art-proposal']
            });
            console.log('已创建美术提案 Issue: ' + title);
