name: "Agent 3 · 索引加速官 (Index Booster)"

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）更新 sitemap 并通知搜索引擎
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index-boost:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 刷新 sitemap 的 lastmod
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          python3 - "$TODAY" << 'PY'
          import re, sys
          today=sys.argv[1]
          p='sitemap.xml'
          s=open(p).read()
          s=re.sub(r'<lastmod>\d{4}-\d{2}-\d{2}</lastmod>', f'<lastmod>{today}</lastmod>', s)
          open(p,'w').write(s)
          print(f'lastmod 已更新为 {today}')
          PY

      - name: 批量通知多引擎索引抓取（IndexNow POST，全量 URL）
        continue-on-error: true
        run: |
          python3 - << 'PY'
          import json, re, urllib.request, urllib.error
          key = "forerui-blessing-indexnow-2026"
          xml = open("sitemap.xml", encoding="utf-8").read()
          urls = re.findall(r"<loc>([^<]+)</loc>", xml)
          # IndexNow 单次上限约 10000 URL，本项目 129 条一次即可
          payload = json.dumps({"host":"blessing.forerui.com","key":key,"urlList":urls}).encode()
          # Bing(美国) / Yandex(俄语区) / Seznam(欧洲) 均支持 IndexNow 公开 POST
          engines = {
              "Bing": "https://www.bing.com/indexnow",
              "Yandex": "https://yandex.com/indexnow",
              "Seznam": "https://search.seznam.cz/indexnow",
          }
          for name, endpoint in engines.items():
              req = urllib.request.Request(
                  endpoint, data=payload, method="POST",
                  headers={"Content-Type":"application/json; charset=utf-8","User-Agent":"Fore-SEO/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      print(f"[{name}] IndexNow 批量推送 {len(urls)} URL → {r.status}")
              except urllib.error.HTTPError as e:
                  print(f"[{name}] HTTP {e.code}（不阻塞）")
              except Exception as e:
                  print(f"[{name}] 推送失败（不阻塞）: {e}")
          PY

      - name: Ping Google sitemap（尽力而为）
        continue-on-error: true
        run: |
          enc=$(python3 -c "import urllib.parse;print(urllib.parse.quote('https://blessing.forerui.com/sitemap.xml',safe=''))")
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
            "https://www.google.com/ping?sitemap=$enc" || echo "000")
          echo "Google sitemap ping → $code"

      - name: 提交 sitemap 变更
        run: |
          bash .github/scripts/safe_push.sh "chore(seo): refresh sitemap lastmod $(date -u +%Y-%m-%d) [skip ci]"
          echo "### 索引加速完成 $(date -u +'%Y-%m-%d')" >> "$GITHUB_STEP_SUMMARY"
